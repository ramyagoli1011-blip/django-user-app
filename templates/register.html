
<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #fce7f3);
            color: #1e293b;
        }

        .card {
            max-width: 760px;
            margin: auto;
            padding: 32px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 35px #00000018;
        }

        h1 {
            text-align: center;
            color: #3730a3;
            margin-bottom: 10px;
        }

        .sub {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 13px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            margin-bottom: 8px;
            min-width: 0;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: white;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #c7d2fe;
            border-color: #6366f1;
        }

        .pass {
            display: flex;
            gap: 7px;
        }

        .pass input {
            flex: 1;
        }

        .pass button {
            padding: 0 12px;
            border: 0;
            border-radius: 8px;
            background: #e0e7ff;
            color: #3730a3;
            cursor: pointer;
        }

        .hint {
            font-size: 12px;
            color: #64748b;
            line-height: 1.5;
            margin: 7px 0 0;
        }

        .check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 22px 0;
            font-size: 14px;
            font-weight: normal;
        }

        .check input {
            width: auto;
            margin-top: 3px;
        }

        .submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit:hover {
            background: #3730a3;
        }

        .bottom {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        .bottom a {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }

        .phone-group {
            display: flex;
            gap: 7px;
        }

        .phone-group select {
            flex: 0 0 42%;
        }

        .phone-group input {
            flex: 1;
            width: 0;
        }

        @media (max-width: 580px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .card {
                padding: 22px 16px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Create Account</h1>
        <p class="sub">Enter your details to register</p>

        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form id="regForm"
              method="post"
              action="/register/"
              enctype="multipart/form-data">

            {% csrf_token %}

            <div class="grid">

                <div class="field">
                    <label for="name">Full Name *</label>
                    <input id="name" name="name" type="text"
                           value="{{ form_data.name|default:'' }}"
                           maxlength="100" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="dob">Date of Birth *</label>
                    <input id="dob" name="dob" type="date"
                           value="{{ form_data.dob|default:'' }}" required>
                </div>

                <div class="field">
                    <label for="gender">Gender *</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select gender</option>
                        <option value="Female" {% if form_data.gender == "Female" %}selected{% endif %}>Female</option>
                        <option value="Male" {% if form_data.gender == "Male" %}selected{% endif %}>Male</option>
                        <option value="Other" {% if form_data.gender == "Other" %}selected{% endif %}>Other</option>
                        <option value="Prefer not to say" {% if form_data.gender == "Prefer not to say" %}selected{% endif %}>Prefer not to say</option>
                    </select>
                </div>

                <div class="field">
                    <label for="photo">Profile Photo (optional)</label>
                    <input id="photo" name="photo" type="file"
                           accept="image/jpeg,image/png,image/webp">
                    <p class="hint">JPG, PNG or WEBP; maximum 2 MB.</p>
                </div>

                <div class="field">
                    <label for="email">Email Address *</label>
                    <input id="email" name="email" type="email"
                           value="{{ form_data.email|default:'' }}"
                           maxlength="254" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="mobile">Mobile Number *</label>
                    <div class="phone-group">
                        <select id="code" name="code" aria-label="Country code" required>
                            <option value="+91" {% if form_data.code == "+91" or not form_data.code %}selected{% endif %}>India +91</option>
                            <option value="+1" {% if form_data.code == "+1" %}selected{% endif %}>USA +1</option>
                            <option value="+44" {% if form_data.code == "+44" %}selected{% endif %}>UK +44</option>
                            <option value="+61" {% if form_data.code == "+61" %}selected{% endif %}>Australia +61</option>
                            <option value="+971" {% if form_data.code == "+971" %}selected{% endif %}>UAE +971</option>
                            <option value="+1">Canada +1</option>
                        </select>

                        <input id="mobile" name="mobile" type="tel"
                               value="{{ form_data.mobile|default:'' }}"
                               inputmode="numeric" pattern="[0-9]{10}"
                               maxlength="10" placeholder="10 digits"
                               autocomplete="tel-national" required>
                    </div>
                </div>

                <div class="field full">
                    <label for="address">Full Address *</label>
                    <textarea id="address" name="address" rows="3"
                              maxlength="500" autocomplete="street-address"
                              required>{{ form_data.address|default:'' }}</textarea>
                </div>

                <div class="field">
                    <label for="country">Country *</label>
                    <select id="country" name="country" required>
                        <option value="India" selected>India</option>
                    </select>
                </div>

                <div class="field">
                    <label for="state">State / Union Territory *</label>
                    <select id="state" name="state" required>
                        <option value="">Select state</option>
                    </select>
                </div>

                <div class="field">
                    <label for="district">District *</label>
                    <select id="district" name="district" required disabled>
                        <option value="">Select district</option>
                    </select>
                </div>

                <div class="field">
                    <label for="city">City / Town *</label>
                    <input id="city" name="city" type="text"
                           value="{{ form_data.city|default:'' }}"
                           maxlength="100" autocomplete="address-level2" required>
                </div>

                <div class="field">
                    <label for="pin">PIN Code *</label>
                    <input id="pin" name="pin" type="text"
                           value="{{ form_data.pin|default:'' }}"
                           inputmode="numeric" pattern="[0-9]{6}"
                           maxlength="6" autocomplete="postal-code" required>
                </div>

                <!-- Password -->
                <div class="field">
                    <label for="password">Password *</label>
                    <div class="pass">
                        <input id="password" name="password" type="password"
                               minlength="4" autocomplete="new-password" required>
                        <button type="button"
                                onclick="showPass('password', this)">Show</button>
                    </div>
                    <p class="hint">
                        Minimum 4 characters. Use letters with numbers or special characters.
                    </p>
                    <p id="strength" class="hint">Password strength: —</p>
                </div>

                <!-- Confirm Password -->
                <div class="field">
                    <label for="confirm">Confirm Password *</label>
                    <div class="pass">
                        <input id="confirm" name="confirm" type="password"
                               minlength="4" autocomplete="new-password" required>
                        <button type="button"
                                onclick="showPass('confirm', this)">Show</button>
                    </div>
                    <p id="match" class="hint"></p>
                </div>

            </div>

            <label class="check">
                <input type="checkbox" id="terms" name="terms"
                       {% if form_data.terms %}checked{% endif %} required>
                <span>I agree to the Terms and Conditions. *</span>
            </label>

            <button class="submit" type="submit">Create Account</button>
        </form>

        <p class="bottom">
            Already have an account?
            <a href="/login/">Login</a>
        </p>
    </main>

    <script>
        function showPass(id, btn) {
            const field = document.getElementById(id);
            field.type = field.type === "password" ? "text" : "password";
            btn.textContent = field.type === "password" ? "Show" : "Hide";
        }

        const pass = document.getElementById("password");
        const confirm = document.getElementById("confirm");
        const strength = document.getElementById("strength");
        const match = document.getElementById("match");

        function checkPass() {
            const p = pass.value;
            let score = 0;

            if (p.length >= 4) score++;
            if (/[A-Za-z]/.test(p)) score++;
            if (/[0-9]/.test(p)) score++;
            if (/[^A-Za-z0-9]/.test(p)) score++;
            if (p.length >= 8) score++;

            let level = "—";

            if (p.length > 0 && p.length < 4) {
                level = "Very Weak";
            } else if (p.length >= 4) {
                if (score <= 2) level = "Medium";
                else if (score <= 3) level = "Good";
                else level = "Strong";
            }

            strength.textContent = "Password strength: " + level;

            confirm.setCustomValidity(
                confirm.value && confirm.value !== p
                    ? "Passwords do not match."
                    : ""
            );

            match.textContent = !confirm.value
                ? ""
                : confirm.value === p
                    ? "Passwords match."
                    : "Passwords do not match.";
        }

        pass.addEventListener("input", checkPass);
        confirm.addEventListener("input", checkPass);

        // State and district list
        const states = {
            "Andhra Pradesh": [
                "Alluri Sitharama Raju", "Anakapalli", "Anantapur",
                "Annamayya", "Bapatla", "Chittoor",
                "Dr. B. R. Ambedkar Konaseema", "East Godavari",
                "Eluru", "Guntur", "Kakinada", "Krishna",
                "Kurnool", "Nandyal", "NTR", "Palnadu",
                "Parvathipuram Manyam", "Prakasam",
                "Sri Potti Sriramulu Nellore", "Sri Sathya Sai",
                "Srikakulam", "Tirupati", "Visakhapatnam",
                "Vizianagaram", "West Godavari", "YSR Kadapa"
            ],

            "Telangana": [
                "Adilabad", "Bhadradri Kothagudem", "Hanumakonda",
                "Hyderabad", "Jagtial", "Jangaon",
                "Jayashankar Bhupalpally", "Jogulamba Gadwal",
                "Kamareddy", "Karimnagar", "Khammam",
                "Komaram Bheem Asifabad", "Mahabubabad",
                "Mahabubnagar", "Mancherial", "Medak",
                "Medchal-Malkajgiri", "Mulugu", "Nagarkurnool",
                "Nalgonda", "Narayanpet", "Nirmal", "Nizamabad",
                "Peddapalli", "Rajanna Sircilla", "Rangareddy",
                "Sangareddy", "Siddipet", "Suryapet", "Vikarabad",
                "Wanaparthy", "Warangal", "Yadadri Bhuvanagiri"
            ],

            "Karnataka": [
                "Bengaluru Urban", "Mysuru", "Belagavi", "Dharwad"
            ],

            "Tamil Nadu": [
                "Chennai", "Coimbatore", "Madurai", "Salem"
            ],

            "Maharashtra": [
                "Mumbai City", "Pune", "Nagpur", "Nashik"
            ]
        };

        const stateSelect = document.getElementById("state");
        const districtSelect = document.getElementById("district");

        Object.keys(states).forEach(function(state) {
            const opt = document.createElement("option");
            opt.value = state;
            opt.textContent = state;
            stateSelect.appendChild(opt);
        });

        function fillDistricts(state, selectedDistrict) {
            districtSelect.innerHTML =
                '<option value="">Select district</option>';

            const list = states[state] || [];
            districtSelect.disabled = list.length === 0;

            list.forEach(function(district) {
                const opt = document.createElement("option");
                opt.value = district;
                opt.textContent = district;

                if (district === selectedDistrict) {
                    opt.selected = true;
                }

                districtSelect.appendChild(opt);
            });
        }

        stateSelect.addEventListener("change", function() {
            fillDistricts(this.value, "");
        });

        // Restore state and district after validation error
        const savedState = "{{ form_data.state|default:''|escapejs }}";
        const savedDistrict = "{{ form_data.district|default:''|escapejs }}";

        if (savedState) {
            stateSelect.value = savedState;
            fillDistricts(savedState, savedDistrict);
        }

        // Enter key moves to the next field
        const form = document.getElementById("regForm");

        form.addEventListener("keydown", function(e) {
            if (e.key !== "Enter") return;

            const current = e.target;

            if (
                !current.matches("input, select, textarea") ||
                current.type === "submit" ||
                current.type === "button"
            ) {
                return;
            }

            if (current.tagName === "TEXTAREA" && e.shiftKey) {
                return;
            }

            e.preventDefault();

            const fields = Array.from(
                form.querySelectorAll(
                    'input:not([type="hidden"]):not([type="submit"]), select, textarea'
                )
            ).filter(function(field) {
                return !field.disabled && field.offsetParent !== null;
            });

            const index = fields.indexOf(current);

            if (index >= 0 && index < fields.length - 1) {
                fields[index + 1].focus();
            } else {
                form.requestSubmit();
            }
        });
    </script>
</body>

</html>
