<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f4f8;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 430px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #263b70;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            background: #263b70;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        .error {
            color: #c62828;
            background: #ffe5e5;
            padding: 10px;
            border-radius: 6px;
        }

        .success {
            color: #237a38;
            background: #e3f6e7;
            padding: 10px;
            border-radius: 6px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #263b70;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Add New Admin</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if success %}
            <p class="success">{{ success }}</p>
        {% endif %}

        <form method="POST" action="/admin-panel/add-admin/">
            {% csrf_token %}

            <label>Admin Name</label>
            <input type="text" name="name" required>

            <label>Admin Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" minlength="8" required>

            <button type="submit">Create Admin</button>
        </form>

        <a href="/admin-panel/dashboard/" class="back">
            Back to Dashboard
        </a>

    </div>

</body>
</html>
